[package]
name = "foreman-app"
description = "Foreman: Tauri shell, IPC commands and DTOs (ADR-001, ADR-003, ADR-004)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
default-run = "foreman-app"

[lib]
name = "foreman_app"
path = "src/lib.rs"

[[bin]]
name = "foreman-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
foreman-core = { path = "../crates/foreman-core" }
foreman-sys = { path = "../crates/foreman-sys" }
# No `devtools` feature (SR-21; checked by config::security_settings_snapshot).
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Native dialogs, the clipboard and notifications, Rust side only (SR-24a, SR-56; design doc §3.2 plugin pins,
# checked against crates.io on 2026-10-20: the newest stable 2.x of each). No capability grants
# any plugin permission to the webview (SR-22).
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-notification = "=2.7.0"
# Same exact pins as foreman-core (design doc §3.2).
jiff = "=0.2.38"
uuid = { version = "=1.28.0", features = ["v4"] }
rustix = { version = "=1.1.5", features = ["fs"] }
# ADR-004: TS bindings are generated only with `--features ts`; release builds never compile ts-rs.
ts-rs = { version = "=12.0.1", optional = true }
# ADR-015: the WebDriver plugin exists only under `e2e`, never in release (release::no_webdriver).
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
proptest = "=1.12.0"
tempfile = "=3.27.0"

[features]
default = []
ts = ["dep:ts-rs"]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true
