# Clippy configuration (ADR-003, SR-02, SR-31a, AC-XC-01, AC-XC-30).
# `disallowed-methods` is denied workspace-wide. The ONLY places allowed to opt out with a
# module-level `#[allow(clippy::disallowed_methods)]` are:
#   - Command::new / CommandBuilder::new: foreman-sys::spawn
#   - std::fs and rustix::fs's open/create/remove/rename/link/chmod calls (N-6):
#     foreman-core::store (incl. store::outside, store::git_exclude),
#     foreman-app::logging, the foreman-sensor crate, fake-claude, and test code (#[cfg(test)], tests/).
# scripts/lint-plants/run.sh proves the rules fire.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

disallowed-methods = [
  { path = "std::process::Command::new", reason = "SR-02: only foreman-sys::spawn constructs a Command" },
  { path = "tokio::process::Command::new", reason = "SR-02: only foreman-sys::spawn constructs a Command", allow-invalid = true },
  { path = "portable_pty::CommandBuilder::new", reason = "SR-02: only foreman-sys::spawn constructs a CommandBuilder", allow-invalid = true },
  { path = "portable_pty::CommandBuilder::new_default_prog", reason = "SR-02: never spawn a default shell", allow-invalid = true },
  { path = "std::fs::canonicalize", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::copy", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::create_dir", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::create_dir_all", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::exists", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::hard_link", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::metadata", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::read", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::read_dir", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::read_link", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::read_to_string", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::remove_dir", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::remove_dir_all", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::remove_file", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::rename", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::set_permissions", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::soft_link", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::symlink_metadata", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::write", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::File::open", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::File::create", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::File::create_new", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::File::options", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::OpenOptions::open", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::fs::DirBuilder::create", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "std::os::unix::fs::symlink", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)" },
  { path = "tokio::fs::read", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::read_to_string", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::write", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::create_dir_all", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::remove_file", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::rename", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::metadata", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::read_dir", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::copy", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::File::open", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::File::create", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  { path = "tokio::fs::OpenOptions::open", reason = "SR-31a: std::fs only in foreman-core::store (AC-XC-30)", allow-invalid = true },
  # Security review 2026-10-20, N-6: rustix's calls that open, create, remove, rename, link or
  # chmod are held to the same sites as std::fs (the store, the sensor crate, tests). Stats
  # (stat, lstat, statat, access) stay allowed: they read metadata only.
  { path = "rustix::fs::open", reason = "N-6: files are opened only in foreman-core::store (SR-31a)" },
  { path = "rustix::fs::openat", reason = "N-6: files are opened only in foreman-core::store (SR-31a)" },
  { path = "rustix::fs::mkdir", reason = "N-6: folders are made only in foreman-core::store (SR-30)" },
  { path = "rustix::fs::mkdirat", reason = "N-6: folders are made only in foreman-core::store (SR-30)" },
  { path = "rustix::fs::unlink", reason = "N-6: removals go through foreman-core::store::app_dirs" },
  { path = "rustix::fs::unlinkat", reason = "N-6: removals go through foreman-core::store::app_dirs" },
  { path = "rustix::fs::rename", reason = "N-6: renames go through foreman-core::store (SR-30)" },
  { path = "rustix::fs::renameat", reason = "N-6: renames go through foreman-core::store (SR-30)" },
  { path = "rustix::fs::renameat_with", reason = "N-6: renames go through foreman-core::store (SR-30)" },
  { path = "rustix::fs::symlink", reason = "N-6: Foreman never makes symlinks outside tests" },
  { path = "rustix::fs::symlinkat", reason = "N-6: Foreman never makes symlinks outside tests" },
  { path = "rustix::fs::link", reason = "N-6: Foreman never makes hard links outside tests" },
  { path = "rustix::fs::linkat", reason = "N-6: Foreman never makes hard links outside tests" },
  { path = "rustix::fs::chmod", reason = "N-6: modes are set only in foreman-core::store" },
  { path = "rustix::fs::fchmod", reason = "N-6: modes are set only in foreman-core::store" },
  { path = "rustix::fs::chmodat", reason = "N-6: modes are set only in foreman-core::store" },
]
