[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
default-members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
authors = ["Billy Ribeiro"]

# Shared lints (ADR-003, SR-62). Every crate opts in with `[lints] workspace = true`.
# `unwrap`/`expect` are allowed in tests through clippy.toml (allow-*-in-tests).
# `clippy::pedantic` applies to foreman-core only (crate attribute in its lib.rs).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = "debuginfo"
